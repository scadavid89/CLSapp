# The ONLY deploy workflow in this repo. If Azure generated its own
# (azure-static-web-apps-<random-name>.yml), delete that file — two workflows
# racing to deploy the same site is the second-most common cause of red runs.
#
# ONE EDIT REQUIRED: Azure creates its deployment-token secret with a random
# suffix, e.g. AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_MEADOW_0F3A1B2C.
# Find yours under Settings > Secrets and variables > Actions, and paste the
# exact name into the two places marked below.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      # Fails the run loudly if the SWA config didn't reach the upload folder.
      # Without it, a missing config silently degrades to "no auth, no routing".
      - name: Verify SWA config shipped
        run: test -f dist/staticwebapp.config.json || (echo "::error::staticwebapp.config.json missing from dist/ — it must live in public/" && exit 1)

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # >>> EDIT: replace with your secret's exact name <<<
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_WAVE_0335EBB0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          # >>> EDIT: same secret name as above <<<
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_WAVE_0335EBB0F }}
          action: close
